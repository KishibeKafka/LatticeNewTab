<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <link rel="icon" href="icons/icon128.png" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ══════════════════════════════════════════════════════════════════
         ENDLESS COLLAGE — tiles are virtualised by collage.js
         ══════════════════════════════════════════════════════════════════ -->
    <div class="collage" id="collage" data-i18n-aria="collage.label">
      <div class="collage__wall" id="collage-wall"></div>
    </div>

    <!-- atmosphere sits above the wall -->
    <div class="atmosphere" aria-hidden="true">
      <div class="atmosphere__wash"></div>
      <div class="atmosphere__vignette"></div>
    </div>

    <!-- the only HUD element: settings -->
    <button class="icon-btn settings-btn" id="open-settings" type="button" data-i18n-aria="action.openSettings" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path d="M19.4 14.4a1.6 1.6 0 0 0 .32 1.77l.06.06a1.94 1.94 0 1 1-2.74 2.74l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.94 1.94 0 1 1-3.88 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a1.94 1.94 0 1 1-2.74-2.74l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97h-.17a1.94 1.94 0 1 1 0-3.88h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.94 1.94 0 1 1 2.74-2.74l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 .97-1.47v-.17a1.94 1.94 0 1 1 3.88 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.94 1.94 0 1 1 2.74 2.74l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.94 1.94 0 1 1 0 3.88h-.09a1.6 1.6 0 0 0-1.47.97Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
      </svg>
    </button>

    <!-- ══════════════════════════════════════════════════════════════════
         SEARCH — overlaid on the expanded centre photo
         ══════════════════════════════════════════════════════════════════ -->
    <div class="center-search" id="center-search" aria-hidden="true">
      <form class="center-search__form" id="center-search-form" role="search" autocomplete="off">
        <svg class="center-search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="m15.4 15.4 4.1 4.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>

        <input
          class="center-search__input"
          id="center-search-input"
          type="search"
          placeholder="Search Google or type a URL"
          data-i18n-aria="search.inputAria"
          aria-label="Search"
          spellcheck="false"
        />

        <label class="center-search__engine">
          <span class="sr-only" data-i18n="search.engineAria">Search engine</span>
          <span id="center-engine-label" aria-hidden="true">Google</span>
          <svg class="center-search__caret" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <select class="center-search__engine-select" id="center-engine" data-i18n-aria="search.engineAria" aria-label="Search engine">
            <option value="google">Google</option>
            <option value="bing">Bing</option>
            <option value="duckduckgo">DuckDuckGo</option>
          </select>
        </label>
      </form>
    </div>

    <!-- ══════════════════════════════════════════════════════════════════
         SHORTCUTS — most-visited sites, in the usual new-tab row
         ══════════════════════════════════════════════════════════════════ -->
    <nav class="shortcuts" id="shortcuts" data-i18n-aria="shortcuts.label" hidden></nav>

    <!-- ══════════════════════════════════════════════════════════════════
         CUSTOMIZE DRAWER
         ══════════════════════════════════════════════════════════════════ -->
    <div class="scrim" id="scrim"></div>

    <aside class="drawer" id="drawer" tabindex="-1" data-i18n-aria="drawer.aria" aria-hidden="true">
      <header class="drawer__head">
        <div>
          <p class="drawer__eyebrow" data-i18n="drawer.eyebrow">Appearance</p>
          <h2 class="drawer__title" data-i18n="drawer.title">Customize</h2>
        </div>
        <button class="icon-btn" id="close-settings" type="button" data-i18n-aria="action.close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <div class="drawer__body">
        <p class="drawer__hint" data-i18n="wall.note">Drag to explore the endless wall · click a photo to bring it forward.</p>
        <!-- ─── Background ─────────────────────────────────────────── -->
        <section class="group">
          <div class="group__head">
            <h3 class="group__label" data-i18n="group.background">Background</h3>
            <span class="group__value" id="source-count"></span>
          </div>

          <div class="src-tabs" role="tablist" aria-label="Image source">
            <button class="src-tab is-active" type="button" role="tab" aria-selected="true" data-tab="upload" data-i18n="tab.upload">Upload</button>
            <button class="src-tab" type="button" role="tab" aria-selected="false" data-tab="url" data-i18n="tab.url">URLs</button>
            <button class="src-tab" type="button" role="tab" aria-selected="false" data-tab="curated" data-i18n="tab.explore">Explore</button>
          </div>

          <!-- upload -->
          <div class="src-panel is-active" data-panel="upload">
            <label class="dropzone" id="dropzone" tabindex="0">
              <input type="file" id="file-input" accept="image/*" multiple hidden />
              <span class="dropzone__icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 16V5m0 0L8 9m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M4.5 14.5v2.7A2.3 2.3 0 0 0 6.8 19.5h10.4a2.3 2.3 0 0 0 2.3-2.3v-2.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span class="dropzone__title" data-i18n="drop.title">Drop photos to add them</span>
              <span class="dropzone__sub" data-i18n="drop.sub">JPG, PNG, WebP or AVIF · stored on this device</span>
            </label>
            <div class="thumbs" id="thumbs"></div>
            <button class="text-btn" id="clear-library" type="button" data-i18n="action.clearLibrary" hidden>Remove all photos</button>
          </div>

          <!-- urls -->
          <div class="src-panel" data-panel="url" hidden>
            <form class="url-row" id="url-form">
              <input class="text-input" id="url-input" type="url" data-i18n-placeholder="url.placeholder" aria-label="Image URL" />
              <button class="btn btn--filled" type="submit" data-i18n="action.add">Add</button>
            </form>
            <p class="micro" data-i18n="url.note">Public image links work too.</p>
            <div class="thumbs" id="url-thumbs"></div>
          </div>

          <!-- curated -->
          <div class="src-panel" data-panel="curated" hidden>
            <div class="chips" id="collections"></div>
            <p class="micro" data-i18n="explore.note">Classic is bundled.</p>
          </div>
        </section>

        <!-- ─── Atmosphere ─────────────────────────────────────────── -->
        <section class="group">
          <h3 class="group__label" data-i18n="group.atmosphere">Atmosphere</h3>

          <div class="control">
            <div class="control__head">
              <label for="dim" data-i18n="control.wash">Wash</label>
              <output id="dim-out"></output>
            </div>
            <input class="range" id="dim" type="range" min="0" max="90" step="1" value="26" />
          </div>

          <div class="control">
            <div class="control__head">
              <label for="blur" data-i18n="control.blur">Blur</label>
              <output id="blur-out"></output>
            </div>
            <input class="range" id="blur" type="range" min="0" max="18" step="1" value="1" />
          </div>

        </section>

        <!-- ─── Appearance ─────────────────────────────────────────── -->
        <section class="group">
          <h3 class="group__label" data-i18n="group.appearance">Appearance</h3>
          <div class="seg" role="group" aria-label="Appearance" id="theme-seg">
            <button type="button" data-value="auto" data-i18n="theme.auto">Auto</button>
            <button type="button" data-value="light" data-i18n="theme.light">Light</button>
            <button type="button" data-value="dark" data-i18n="theme.dark">Dark</button>
          </div>
        </section>

        <!-- ─── Language ───────────────────────────────────────────── -->
        <section class="group">
          <h3 class="group__label" data-i18n="control.language">Language</h3>
          <div class="seg" role="group" aria-label="Language" id="lang-seg">
            <button type="button" data-value="auto" data-i18n="lang.auto">Auto</button>
            <button type="button" data-value="en" data-i18n="lang.en">English</button>
            <button type="button" data-value="zh" data-i18n="lang.zh">中文</button>
          </div>
        </section>
      </div>

      <footer class="drawer__foot">
        <button class="text-btn" id="reset-btn" type="button" data-i18n="btn.reset">Reset layout</button>
        <button class="btn btn--filled" id="done-btn" type="button" data-i18n="btn.done">Done</button>
      </footer>
    </aside>

    <dialog class="shortcut-dialog" id="shortcut-dialog">
      <form class="shortcut-dialog__form" id="shortcut-form">
        <h2 class="shortcut-dialog__title" id="shortcut-dialog-title" data-i18n="shortcuts.newTitle">New shortcut</h2>

        <label class="shortcut-dialog__field">
          <span data-i18n="shortcuts.name">Name</span>
          <input class="text-input" id="shortcut-name" maxlength="60" autocomplete="off" />
        </label>

        <label class="shortcut-dialog__field">
          <span data-i18n="shortcuts.url">URL</span>
          <input class="text-input" id="shortcut-url" type="text" inputmode="url" autocomplete="off" placeholder="https://example.com" />
        </label>

        <div class="shortcut-dialog__icon">
          <span class="shortcut-dialog__preview"><img id="shortcut-icon-preview" alt="" /></span>
          <div class="shortcut-dialog__icon-actions">
            <label class="btn" for="shortcut-icon-input" data-i18n="shortcuts.icon">Custom icon</label>
            <input class="sr-only" type="file" id="shortcut-icon-input" accept="image/*" />
            <button class="text-btn" id="shortcut-icon-reset" type="button" data-i18n="shortcuts.iconReset">Use site icon</button>
          </div>
        </div>

        <p class="shortcut-dialog__error" id="shortcut-error" data-i18n="shortcuts.invalidUrl" hidden>Enter a valid URL</p>

        <div class="shortcut-dialog__actions">
          <button class="text-btn" id="shortcut-delete" type="button" data-i18n="shortcuts.delete" hidden>Delete</button>
          <span class="shortcut-dialog__spacer"></span>
          <button class="btn" id="shortcut-cancel" type="button" data-i18n="shortcuts.cancel">Cancel</button>
          <button class="btn btn--filled" id="shortcut-save" type="submit" data-i18n="shortcuts.save">Save</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="i18n.js" defer></script>
    <script src="store.js" defer></script>
    <script src="library.js" defer></script>
    <script src="shortcuts.js" defer></script>
    <script src="collage.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
